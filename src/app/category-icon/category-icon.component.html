<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.6"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (iconKey()) {
    @case ('oven') {
      <rect x="3" y="3.5" width="18" height="17" rx="2" />
      <line x1="3" y1="8.5" x2="21" y2="8.5" />
      <circle cx="6.5" cy="6" r="0.7" />
      <circle cx="10" cy="6" r="0.7" />
      <circle cx="17.5" cy="6" r="0.7" />
      <rect x="6" y="11" width="12" height="7.5" rx="1" />
      <line x1="6" y1="14.5" x2="18" y2="14.5" />
    }
    @case ('toaster') {
      <rect x="3" y="7" width="18" height="13" rx="2" />
      <rect x="6" y="3.5" width="3" height="6" rx="0.6" />
      <rect x="10.5" y="3.5" width="3" height="6" rx="0.6" />
      <rect x="15" y="3.5" width="3" height="6" rx="0.6" />
      <circle cx="6.5" cy="16.5" r="0.7" />
      <line x1="9.5" y1="16.5" x2="17.5" y2="16.5" />
    }
    @case ('grill') {
      <path
        d="M12 3.5c1.4 2.5 3.5 4 3.5 7.5a3.5 3.5 0 0 1-3.5 3.5 3.5 3.5 0 0 1-3.5-3.5C8.5 8 11 7.5 12 3.5z"
      />
      <path
        d="M12 14.5c4 0 6 2.5 6 4s-2 2-3 2H9c-1 0-3 0-3-2s2-4 6-4z"
      />
      <line x1="5" y1="20.5" x2="19" y2="20.5" />
    }
    @case ('thermostat') {
      <path
        d="M14 4a2 2 0 0 0-4 0v10.2a4 4 0 1 0 4 0z"
      />
      <line x1="12" y1="6.5" x2="12" y2="14" />
      <circle cx="12" cy="17.5" r="1.5" fill="currentColor" />
    }
    @case ('coffee') {
      <path
        d="M4 9h12v5.5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"
      />
      <path
        d="M16 10.5h2.2a2.3 2.3 0 0 1 0 4.5H16"
      />
      <line x1="3" y1="21" x2="17" y2="21" />
      <path d="M7.5 3.5c-0.5 1 0.5 2 0 3" />
      <path d="M10.5 3.5c-0.5 1 0.5 2 0 3" />
      <path d="M13.5 3.5c-0.5 1 0.5 2 0 3" />
    }
    @case ('industrial') {
      <path
        d="M3 21V11l5 3.2V11l5 3.2V11l5 3.2V7l3-3v17z"
      />
      <line x1="7" y1="17" x2="7" y2="19" />
      <line x1="12" y1="17" x2="12" y2="19" />
      <line x1="17" y1="17" x2="17" y2="19" />
    }
    @case ('water-heater') {
      <path
        d="M12 3s6.5 7 6.5 12a6.5 6.5 0 0 1-13 0C5.5 10 12 3 12 3z"
      />
      <path
        d="M9 13c0.8 1.5 2.2 2 3 2.5 1 0.5 1.5 1.5 1 2.5"
      />
    }
    @case ('washing-machine') {
      <rect x="4" y="3" width="16" height="18" rx="2" />
      <circle cx="12" cy="14" r="5" />
      <circle cx="12" cy="14" r="2" />
      <circle cx="7" cy="6.5" r="0.7" />
      <circle cx="10" cy="6.5" r="0.7" />
      <circle cx="17" cy="6.5" r="0.7" fill="currentColor" />
    }
    @case ('ventilation') {
      <circle cx="12" cy="12" r="1.8" />
      <path
        d="M11.8 10C11 5.5 8 4 7 4c-1 0-1.7 1.8-0.7 3.8s3.7 3 5.5 2.5"
      />
      <path
        d="M14 12.2c4.5-0.8 6-3.8 6-4.8 0-1-1.8-1.7-3.8-0.7s-3 3.7-2.5 5.5"
      />
      <path
        d="M12.2 14c0.8 4.5 3.8 6 4.8 6 1 0 1.7-1.8 0.7-3.8s-3.7-3-5.5-2.5"
      />
      <path
        d="M10 11.8C5.5 12.6 4 15.6 4 16.6c0 1 1.8 1.7 3.8 0.7s3-3.7 2.5-5.5"
      />
    }
    @default {
      <circle cx="12" cy="12" r="9" />
      <line x1="12" y1="8" x2="12" y2="13" />
      <circle cx="12" cy="16" r="0.9" fill="currentColor" />
    }
  }
</svg>
