<section id="section" class="splide" aria-label="Splide Basic HTML Example">
  <div class="splide__track">
    <ul class="splide__list">
      @for (item of popularList; track item) {
        <li class="splide__slide">
          <a [routerLink]="['/favorite', item.id]"
            ><img [src]="item.image" alt="" />
            <p>{{ item.code }}</p></a
            >
          </li>
        }
      </ul>
    </div>
  </section>
